name: Check Inline JS Syntax

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  check-syntax:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Check inline JavaScript syntax
        run: node scripts/check-inline-js.js
